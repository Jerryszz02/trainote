name: Trainote

options:
  bundleIdPrefix: com.jerryszz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

targets:
  Trainote:
    type: application
    platform: iOS
    sources:
      - path: Trainote
        excludes:
          - Resources
      - path: Trainote/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jerryszz.trainote
        PRODUCT_NAME: Trainote
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Trainote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - TrainoteTests
        - TrainoteUITests

  TrainoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrainoteTests
    dependencies:
      - target: Trainote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jerryszz.trainote.tests
        GENERATE_INFOPLIST_FILE: YES

  TrainoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TrainoteUITests
    dependencies:
      - target: Trainote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jerryszz.trainote.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Trainote

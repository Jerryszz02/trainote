    <h1>Trainote 帮助与反馈</h1>
    <p class="meta">适用于 Trainote 1.0 · 需要 iOS 17 或更高版本</p>

    <h2>数据保存在哪里？</h2>
    <p>所有训练和饮食记录都保存在当前设备。Trainote 没有账号和云同步功能。</p>

    <h2>如何删除数据？</h2>
    <p>单条记录可以在对应列表中编辑或删除。若要删除全部本地数据，可以卸载应用。</p>

    <h2>更换手机后能自动恢复吗？</h2>
    <p>Trainote 不提供自己的同步服务。数据能否恢复取决于你的 iPhone 系统备份与迁移设置。</p>

    <h2>反馈问题</h2>
    <p>请在 <a href="https://github.com/Jerryszz02/trainote/issues">GitHub Issues</a> 提交问题。为了保护隐私，请不要附上真实训练、饮食、健康信息或其他敏感内容。</p>

    <p><a href="../privacy/">查看隐私政策</a></p>
  </body>
